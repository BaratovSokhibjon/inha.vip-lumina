# Hardware pin mappings for Lumina

hardware_pins:
  # LED Strip Configuration
  led_strip_pin: 12
  led_strip_count: 60

  # Button Pins
  buttons:
    power_button_pin: 2
    color_button_pin: 3
    mode_button_pin: 4

  # MCP3008 ADC Pins (for potentiometer)
  mcp3008:
    clk_pin: 11
    miso_pin: 9
    mosi_pin: 10
    cs_pin: 8
    brightness_channel: 0

  # Speaker Pin
  speaker_pin: 13

  # Button Settings
  button_debounce_time: 0.2

# System Settings
system_startup_delay: 2

system:
  database_path: data/lumina.db
  log_file_path: logs/lumina.log
  log_level: INFO

web:
  update_interval: 5
